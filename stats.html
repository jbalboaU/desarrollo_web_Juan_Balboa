<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats</title>

    <link rel = "stylesheet" href = "stats.css">
</head>
<body>
    <div class = "title">
        <h1>Estadísticas</h1>
    </div>
    <div class = "graficos">
        <div class = "grafico1">
            <h2>Actividades por día</h2>
            <img src = "Grafico1.png" alt = "Actividades por día">
        </div>
        <div class = "grafico2">
            <h2> Total de actividades por tipo</h2>
            <img src = "Grafico2.png" alt = "Total de actividades por tipo">
        </div>
        <div class = "grafico3">
            <h2> Actividades por mes según horario</h2>
            <img src = "Grafico3.png" alt = "Actividades por mes según horario en que se imparte">
        </div>
    </div>
    <div class = "button">
        <button class = "return" id = "return">Inicio</button>
    </div>
    <script src="stats.js"></script>
</body>
</html>
