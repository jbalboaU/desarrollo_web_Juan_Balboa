<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar-Actividad</title>

    <link rel = "stylesheet" href = "add.css">
</head>
<body>
    <h1>Formulario</h1>
    <div class = "main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
            <form name = "myForm" method = "post" enctype="multipart/form-data">
            <div class = "place">
                <h3>¿Dónde?</h3>
            
                <label for ="region-select"> Región </label>
                <select name= "region" id ="region-select" required>
                    <option value ="">Seleccione una Región</option>
                </select>

                <label for = "comuna-select">Comuna</label>
                <select name="comuna" id="comuna-select" required>
                    <option value ="">Seleccione una Comuna</option>
                </select>

                <label for="sector-text" style = "display:none;">Sector</label>
                <textarea name="sector" id="sector" rows="4" cols="50" style="display:none;"></textarea>
            </div>
            <div class = "who">
                <h3>¿Quién organiza?</h3>
                <label for="nombre">Nombre</label>
                    <input type = "text" id="nombre" required>

                <label for="email">Email</label>
                    <input type = "email" name ="email" id="email" required>
                
                <label for="phone">Número de Celular</label>
                    <input type = "tel" id="phone">

                <label for="contacto-select">Contactar por:</label>
                <select name = "redes" id="contacto-select">
                    <option value ="">Seleccione una Red Social</option>
                    <option value ="2">WhatsApp</option>
                    <option value ="2">Telegram</option>
                    <option value ="3">X</option>
                    <option value ="4">Instagram</option>
                    <option value ="5">Tiktok</option>
                </select>

                <label for="redes" style = "display:none;">URL</label>
                <textarea name="URL" id="redes" rows="2" cols="50" minlength="4" maxlength="50" style="display:none;"></textarea>
            </div>
            <div class = "when">
                <h3>¿Cuándo y de qué trata?</h3>
                <label for="inicio">Día hora inicio</label>
                    <input type = "datetime-local" id="inicio" required>
                
                <label for="termino">Día hora término</label>
                    <input type = "datetime-local" id="termino">
                
                <label for="descripcion">Descripción</label>
                    <textarea name="descripcion" id="descripcion" rows="10" cols="50" ></textarea>
                
                <label for="tema">Tema</label>
                <select name = "tema" id ="tema-select" required>
                    <option value = "">Seleccione un tema</option>
                    <option value = "1">Música</option>
                    <option value = "2">Deporte</option>
                    <option value = "3">Ciencias</option>
                    <option value = "4">Religión</option>
                    <option value = "5">Política</option>
                    <option value = "6">Tecnología</option>
                    <option value = "7">Juegos</option>
                    <option value = "8">Baile</option>
                    <option value = "9">Comida</option>
                    <option value = "10">Otros</option>
                </select>

                <label for="descripcion-tema" style = "display:none;">¿De qué trata?</label>
                <textarea name="descripcion-tema" id="descripcion-tema" rows="2" cols="50" minlength="4" maxlength="50" style="display:none;"></textarea>

                <label for="files">Foto</label>
                    <input type = "file" id="files" required>
            </div>
                
                <button class = "submit-btn" id="submit-btn" type = "button">Agregar esta actividad</button>
            </form>
    </div>
    <div class = "button">
        <button class = "return" id = "return">Inicio</button>
    </div>
    <script src="validation.js"></script>
    <script src="add.js"></script>
</body>
</html>
