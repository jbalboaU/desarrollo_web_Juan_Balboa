<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar-Actividad</title>
    
    <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/add.css')}}">
</head>
<body>
    <h1>Formulario</h1>
    <div class = "main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
            <form name = "myForm" method = "post" enctype="multipart/form-data">
            <div class = "place">
                <h3>¿Dónde?</h3>
            
                <label for ="region-select"> Región </label>
                <select name= "region" id ="region-select" required>
                    <option value ="">Seleccione una Región</option>
                </select>

                <label for = "comuna-select">Comuna</label>
                <select name="comuna" id="comuna-select" required>
                    <option value ="">Seleccione una Comuna</option>
                </select>

                <label for="sector" style = "display:none;">Sector</label>
                <textarea name="sector" id="sector" rows="4" cols="50" style="display:none;"></textarea>
            </div>
            <div class = "who">
                <h3>¿Quién organiza?</h3>
                <label for="nombre">Nombre</label>
                    <input name= "nombre" type = "text" id="nombre" required>

                <label for="email">Email</label>
                    <input name = "email" type = "email" id="email" required>
                
                <label for="celular">Número de Celular</label>
                    <input type = "tel" name ="celular" id="celular">

                <label for="contactar_por">Contactar por:</label>
                <select name = "contactar_por" id="contactar_por">
                    <option value ="">Seleccione una Red Social</option>
                    <option value ="2">WhatsApp</option>
                    <option value ="2">Telegram</option>
                    <option value ="3">X</option>
                    <option value ="4">Instagram</option>
                    <option value ="5">Tiktok</option>
                </select>

                <label for="contacto_id" style = "display:none;">URL</label>
                <textarea name="contacto_id" id="contacto_id" rows="2" cols="50" minlength="4" maxlength="50" style="display:none;"></textarea>
            </div>
            <div class = "when">
                <h3>¿Cuándo y de qué trata?</h3>
                <label for="inicio">Día hora inicio</label>
                    <input type = "datetime-local" name="inicio" id="inicio" required>
                
                <label for="termino">Día hora término</label>
                    <input type = "datetime-local" name="termino" id="termino">
                
                <label for="descripcion">Descripción</label>
                    <textarea name="descripcion" id="descripcion" rows="10" cols="50" ></textarea>
                
                <label for="tema">Tema</label>
                <select name = "tema" id ="tema" required>
                    <option value = "">Seleccione un tema</option>
                    <option value = "1">Música</option>
                    <option value = "2">Deporte</option>
                    <option value = "3">Ciencias</option>
                    <option value = "4">Religión</option>
                    <option value = "5">Política</option>
                    <option value = "6">Tecnología</option>
                    <option value = "7">Juegos</option>
                    <option value = "8">Baile</option>
                    <option value = "9">Comida</option>
                    <option value = "10">Otros</option>
                </select>

                <label for="descripcion_tema" style = "display:none;">¿De qué trata?</label>
                <textarea name="descripcion_tema" id="descripcion_tema" rows="2" cols="50" minlength="4" maxlength="50" style="display:none;"></textarea>

                <label for="fotos">Foto</label>
                    <input name="fotos"type="file" id="fotos" required>
            </div>
                
                <button class = "submit-btn" id="submit-btn" type = "button">Agregar esta actividad</button>
            </form>
    </div>
    <div class = "button">
        <button class = "return" id = "return">Inicio</button>
    </div>
    <script src="validation.js"></script>
    <script src="{{ url_for('static', filename = 'js/add.js')}}"></script>
</body>
</html>
